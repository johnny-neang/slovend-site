<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slovend — Good fortune, freshly vended</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="One beautifully kept vending machine, stocked with care and watched over by the lucky cat.">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="slovend.css">
  <style>
    .hero {
      position: relative; min-height: calc(100vh - 62px);
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: 80px var(--gutter); overflow: hidden;
    }
    .hero .sunburst { bottom: -62%; width: min(1100px, 150vw); aspect-ratio: 1; }
    .hero-glow {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(120% 80% at 50% 10%, rgba(209,43,63,.08), transparent 55%);
    }
    .hero-frame { position: absolute; inset: 22px; border: 1px solid var(--cherry-line); pointer-events: none; }
    .hero-frame::after { content: ""; position: absolute; inset: 6px; border: 1px solid var(--line); }
    .hero-inner { position: relative; z-index: 2; max-width: 820px; }
    .hero-logo { width: min(360px, 74vw); margin: 0 auto 26px; }
    .hero h1 { font-size: clamp(42px, 8vw, 88px); margin: 22px 0 0; }
    .hero .lead { margin: 24px auto 0; max-width: 520px; }
    .hero-cta { display: flex; gap: 14px; justify-content: center; margin-top: 36px; flex-wrap: wrap; }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <nav class="nav">
      <a class="nav-logo" href="/" aria-label="Slovend home"><img src="assets/slovend-wordmark.png" alt="Slovend"></a>
      <div class="nav-links" id="navLinks">
        <a href="locations.html">Locations</a>
        <a href="vendai.html">Vendai</a>
        <a href="about.html">About</a>
      </div>
      <div class="nav-cta">
        <button class="nav-toggle" aria-label="Menu"><span></span></button>
      </div>
    </nav>
  </header>

  <!-- ===== HERO ===== -->
  <section class="hero">
    <div class="sunburst"></div>
    <div class="hero-glow"></div>
    <div class="hero-frame"></div>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>

    <div class="hero-inner">
      <img class="hero-logo" src="assets/slovend-logo.png" alt="Slovend Vending">
      <div class="kicker center">Inviting Fortune Since 2025</div>
      <h1 class="serif-display">Good fortune,<br><span class="ital">freshly vended.</span></h1>
      <p class="lead">One beautifully kept vending machine, stocked with care and watched over by the lucky cat.</p>
      <div class="hero-cta">
        <a href="locations.html" class="btn btn-gold">Find our machine</a>
      </div>
    </div>
  </section>

  <footer class="foot">
    <div class="in"><p>Copyright 2026 · Slovend LLC, a subsidiary of <a href="https://futurenow.co" target="_blank" rel="noopener" style="color:var(--cherry-hi);text-decoration:none;">FutureNow, Inc.</a> · Sheridan, WY</p></div>
  </footer>

  <script src="slovend.js"></script>
</body>
</html>
