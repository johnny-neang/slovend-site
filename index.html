<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slovend Vending</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4ede0;
      color: #1a1a1a;
    }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    .logo {
      width: min(90vw, 720px);
      height: auto;
      display: block;
    }
    p {
      font-size: clamp(0.9rem, 1.6vw, 1.125rem);
      margin-top: 1.5rem;
      color: #6b6151;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Slovend Vending" />
    <p>Vending Machines</p>
  </main>
</body>
</html>
